name: Solana Arbitrage Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: solana-arbitrage
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-arb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Continuous Scan Engine
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DESTINATION_WALLET: ${{ secrets.DESTINATION_WALLET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          END_TIME=$(( $(date +%s) + 240 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            if node swap-execute.js; then
              node settlement.js || true
            fi
            sleep 5
          done
          gh workflow run main.yml --repo ${{ github.repository }}
