name: Solana Arbitrage Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-arb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: High-Frequency Continuous Scan
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DESTINATION_WALLET: ${{ secrets.DESTINATION_WALLET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          END_TIME=$(( $(date +%s) + 60 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            node swap-execute.js || true
            node settlement.js || true
            sleep 3
          done
          gh workflow run main.yml --repo ${{ github.repository }}
