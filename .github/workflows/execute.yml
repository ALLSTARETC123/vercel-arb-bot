name: Real Swap Execution
on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'
env:
  CACHE_BUST: ${{ github.run_id }}
jobs:
  swap:
    runs-on: ubuntu-latest
    env:
      SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v3
      - run: npm install @solana/web3.js bs58@5 --no-cache
      - name: Debug secret presence
        run: node -e "console.log(process.env.SOLANA_PRIVATE_KEY ? 'SECRET_OK len='+process.env.SOLANA_PRIVATE_KEY.length : 'SECRET_MISSING')"
      - name: Execute swaps and settle profits
        run: node swap-execute.js 2>&1
