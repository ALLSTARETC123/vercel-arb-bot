name: Real Swap Execution
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Execute real swaps
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: npm install @solana/web3.js bs58@5 && node swap.js
